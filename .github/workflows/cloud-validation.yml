name: Cloud validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cloud-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < worker.js
          python3 -c 'import pathlib,re,sys; h=pathlib.Path("index.html").read_text(); s=re.findall(r"<script>(.*?)</script>",h,re.S); assert len(s)==1; sys.stdout.write(s[0])' | node --check
      - name: Scan repository history for secrets
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none -v "$PWD:/repo:ro" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:e4037a313035c932d6b14b934edc5da9bbf6212b52da0b94870e1448ed4b8e2b git --redact --log-opts="--all" /repo
