name: Cloud validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cloud-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < worker.js
          node --input-type=module --check < github-runs.js
          node --test tests/github-runs.test.mjs tests/auth-release.test.mjs tests/cloud-core.test.mjs
          python3 -c 'import pathlib,re,sys; h=pathlib.Path("index.html").read_text(); s=re.findall(r"<script>(.*?)</script>",h,re.S); assert len(s)==1; sys.stdout.write(s[0])' | node --check
      - name: Scan repository history for secrets
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --proto-redir '=https' 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' -o "$tmp/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$tmp/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$tmp/gitleaks.tar.gz" -C "$tmp" gitleaks
          "$tmp/gitleaks" version
          "$tmp/gitleaks" git --redact --log-opts="--all" .
      - name: Semgrep local blocking security rules
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          python3 -m venv "$tmp/venv"
          "$tmp/venv/bin/pip" install --disable-pip-version-check semgrep==1.187.0
          mkdir "$tmp/source"
          cp worker.js github-runs.js backup/lab.mjs "$tmp/source/"
          cp monitor/lab.mjs "$tmp/source/monitor-lab.mjs"
          python3 -c 'import pathlib,re,sys; h=pathlib.Path("index.html").read_text(); s=re.findall(r"<script>(.*?)</script>",h,re.S); assert len(s)==1; sys.stdout.write(s[0])' > "$tmp/source/dashboard.js"
          "$tmp/venv/bin/semgrep" scan --config "$PWD/.semgrep.yml" --metrics=off --disable-version-check --strict --error --no-git-ignore "$tmp/source"
      - name: Install pinned browser test tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/lts-browser"
          "$RUNNER_TEMP/lts-browser/bin/pip" install --disable-pip-version-check -r tests/requirements.txt
          mkdir -p "$RUNNER_TEMP/lts-dependencies"
          "$RUNNER_TEMP/lts-browser/bin/pip" freeze > "$RUNNER_TEMP/lts-dependencies/requirements.txt"
      - name: OSV dependency vulnerability gate
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --proto-redir '=https' 'https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64' -o "$tmp/osv-scanner"
          printf '%s  %s\n' 'fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8' "$tmp/osv-scanner" | sha256sum --check --strict
          chmod 700 "$tmp/osv-scanner"
          "$tmp/osv-scanner" scan source --recursive .
          "$tmp/osv-scanner" scan source --lockfile="$RUNNER_TEMP/lts-dependencies/requirements.txt"
      - name: Isolated hosting HTTP laboratory
        run: python3 tests/hosting_lab_test.py
      - name: Isolated PostgreSQL RLS laboratory
        run: bash tests/database_lab.sh
      - name: D1-compatible SQLite capacity test
        run: python3 tests/cloud_core_sql.py
      - name: Isolated private storage laboratory
        run: python3 tests/storage_lab_test.py
      - name: Encrypted backup restore and local monitor laboratory
        run: node --test tests/backup_monitor.test.mjs
      - name: Offline Chromium desktop and mobile smoke
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/lts-browser/bin/playwright" install --with-deps chromium
          "$RUNNER_TEMP/lts-browser/bin/python" tests/dashboard_smoke.py
          "$RUNNER_TEMP/lts-browser/bin/python" tests/hosting_browser.py
          "$RUNNER_TEMP/lts-browser/bin/python" tests/database_browser.py
          "$RUNNER_TEMP/lts-browser/bin/python" tests/storage_browser.py
          "$RUNNER_TEMP/lts-browser/bin/python" tests/backup_monitor_browser.py
          "$RUNNER_TEMP/lts-browser/bin/python" tests/release_mobile.py
